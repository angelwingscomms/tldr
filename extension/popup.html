<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>tldr</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body { width: 100%; height: 100%; }
			iframe { border: 0; width: 100%; height: 100%; }
		</style>
		<script>
			const frame = document.createElement('iframe');
			chrome.storage.local.get('token', (st) => {
				frame.src = st.token ? `/e#t=${encodeURIComponent(st.token)}` : '/e';
			});
			document.body.appendChild(frame);
			window.addEventListener('message', (e) => {
				if (e.origin !== 'https://tldr.apexlinks.org') return;
				const t = e.data?.t;
				if (typeof t === 'string') chrome.storage.local.set({ token: t });
			});
		</script>
	</head>
	<body></body>
</html>
